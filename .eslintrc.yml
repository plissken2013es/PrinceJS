---
root: true
#  https://eslint.org/docs/rules/
env:
  browser: true
  es2020: true
parserOptions:
  ecmaVersion: 2020
  sourceType: module
extends:
  - "eslint:recommended"
  - prettier
rules:
  no-var: [error]
  no-unused-vars: [error, { argsIgnorePattern: "data|game|tile" }]
  no-restricted-modules: [error, child_process, fs]
  no-eval: [error]
  no-implied-eval: [error]
  no-console: [error]
  strict: [warn]
  curly: [error]
  no-constant-condition: [error, { checkLoops: false }]
overrides:
  - files: ["tests/**/*.js", "playwright.config.js"]
    env:
      node: true
    parserOptions:
      sourceType: script
    globals:
      PrinceJS: false
      Phaser: false
